<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Smart Dash — control every smart device in your home from one beautiful dashboard.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Dash">
  <title>Smart Dash</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="grain" aria-hidden="true"></div>

  <div id="splash" aria-hidden="true">
    <div class="splash-logo"></div>
    <div class="splash-word">Smart<b>Dash</b></div>
    <div class="splash-bar"><i></i></div>
  </div>

  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation"></aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <nav class="tabbar" aria-label="Main navigation"></nav>

  <div id="overlay-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem;color:#fff">Smart Dash needs JavaScript enabled.</p></noscript>
</body>
</html>
